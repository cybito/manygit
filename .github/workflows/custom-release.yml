name: Custom release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: custom-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'cybito/manygit' && !github.event.release.draft
    runs-on: ubuntu-24.04-arm
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch custom ancestry without persisted credentials
        shell: bash
        run: git fetch --no-tags origin +refs/heads/custom:refs/remotes/origin/custom
      - id: validate
        name: Validate exact custom release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess,tempfile
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if event['action']!='published' or event['release']['draft'] or event['release']['assets']: raise ValueError('release must be published with no attached assets')
          paths=('.github/workflows/custom-release.yml','.github/scripts/custom-release.sh','.github/scripts/package-release.py')
          def validate(tag,cwd=None):
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-custom\.[1-9][0-9]*',tag):
                  raise ValueError('invalid release tag')
              def git(*args): return subprocess.check_output(['git',*args],cwd=cwd,text=True,stderr=subprocess.DEVNULL).strip()
              commit=git('rev-parse','--verify','refs/tags/'+tag+'^{commit}')
              if not re.fullmatch(r'[0-9a-f]{40}',commit): raise ValueError('invalid source SHA')
              git('merge-base','--is-ancestor',commit,'refs/remotes/origin/custom')
              for path in paths: git('cat-file','-e',commit+':'+path)
              if git('rev-parse','HEAD')!=commit: raise ValueError('release checkout differs from tag')
              return commit
          # Real Git/event boundary regression fixtures, not YAML string tests.
          with tempfile.TemporaryDirectory() as tmp:
              def fixture(*args): return subprocess.check_output(['git',*args],cwd=tmp,text=True,stderr=subprocess.DEVNULL).strip()
              fixture('init'); fixture('config','user.name','CI'); fixture('config','user.email','ci@example.invalid')
              for path in paths:
                  file=pathlib.Path(tmp)/path; file.parent.mkdir(parents=True,exist_ok=True); file.write_text('fixture')
              fixture('add','.'); fixture('commit','-m','custom fixture')
              root=fixture('rev-parse','HEAD'); fixture('update-ref','refs/remotes/origin/custom',root)
              fixture('tag','v1.1.7-custom.1')
              assert validate('v1.1.7-custom.1',tmp)==root
              fixture('commit','--allow-empty','-m','upstream only')
              fixture('tag','v1.1.7-custom.2')
              for invalid in ('v1.1.7-custom.2','v1.1.7','v1.1.7-custom.0','v1.1.7-custom.1;touch '+tmp+'/injected'):
                  try: validate(invalid,tmp)
                  except (ValueError,subprocess.CalledProcessError): pass
                  else: raise AssertionError('invalid release accepted: '+invalid)
              assert not (pathlib.Path(tmp)/'injected').exists()
          tag=os.environ['RELEASE_TAG']
          commit=validate(tag)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('commit='+commit+'\ntag='+tag+'\n')
          PY
  build:
    needs: validate
    environment: forgejo-registry
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: custom-release-${{ github.repository }}-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      MANYGIT_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - &oras
        name: Install checksum-verified ORAS 1.3.3
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in Darwin) os=darwin; expected=f33fc12753c54172b0d0d19eaa0318d3f90fe9b094d96e8b259c881713c92e1c;; Linux) os=linux; expected=ac7156f93a21e903f7ad606c792f3560f17e0cd0e36365634701b1e7cc4e4eca;; *) exit 1;; esac
          tools="$RUNNER_TEMP/oras-tools"
          mkdir -p "$tools"
          cd "$tools"
          archive="oras_1.3.3_${os}_arm64.tar.gz"
          base=https://github.com/oras-project/oras/releases/download/v1.3.3
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/oras_1.3.3_checksums.txt" -o checksums.txt
          python3 - "$archive" "$expected" <<'PY'
          import hashlib,pathlib,sys
          name, pinned=sys.argv[1:]
          matches=[line.split()[0] for line in pathlib.Path('checksums.txt').read_text().splitlines() if line.split()[-1].lstrip('*')==name]
          if len(matches)!=1 or matches[0]!=pinned or hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()!=pinned: raise SystemExit('ORAS pinned checksum mismatch')
          PY
          tar -xzf "$archive" oras
          echo "$tools" >> "$GITHUB_PATH"
      - name: Exercise registry failure and identity boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib,subprocess,tempfile
          from unittest.mock import patch
          spec=importlib.util.spec_from_file_location('package_release','.github/scripts/package-release.py')
          helper=importlib.util.module_from_spec(spec); spec.loader.exec_module(helper)
          with tempfile.TemporaryDirectory() as tmp:
              config=pathlib.Path(tmp)/'auth.json'; config.write_text('{"auths":{}}')
              for error in (b'unauthorized: authentication required',b'connection timeout',b'404 Not Found'):
                  with patch.object(helper.subprocess,'run',return_value=subprocess.CompletedProcess([],1,b'',error)):
                      try: helper.resolve(config,helper.PACKAGE+':fixture')
                      except RuntimeError: pass
                      else: raise AssertionError('non-protocol error treated as absence')
              with patch.object(helper.subprocess,'run',return_value=subprocess.CompletedProcess([],1,b'',b'MANIFEST_UNKNOWN: manifest unknown')):
                  assert helper.resolve(config,helper.PACKAGE+':fixture') is None
              receipt={'release_tag':'v1.1.7-custom.1','source_commit':'b'*40,'platform':'linux'}
              with patch.object(helper,'resolve',return_value=helper.PACKAGE+'@sha256:'+'c'*64),patch.object(helper,'verify',return_value=receipt):
                  try: helper.check(config,'v1.1.7-custom.1','a'*40,'linux',pathlib.Path(tmp)/'pull')
                  except ValueError: pass
                  else: raise AssertionError('different source receipt reused')
          PY
      - name: Check immutable release before compiling
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/existing" > "$RUNNER_TEMP/check.json"
          python3 - <<'PY'
          import json,os
          result=json.load(open(os.environ['RUNNER_TEMP']+'/check.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('exists='+str(result['exists']).lower()+'\n')
          if result['exists']:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Verified existing immutable package: `'+result['reference']+'`\n')
          PY
      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - if: steps.check.outputs.exists == 'false'
        name: Build native ARM64 package and smoke fixture install
        shell: bash
        run: bash .github/scripts/custom-release.sh build "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/build"
      - if: steps.check.outputs.exists == 'false'
        name: Publish and independently verify immutable OCI package
        shell: bash
        env:
          FORGEJO_REGISTRY_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          authdir="$RUNNER_TEMP/forgejo-auth"
          mkdir -m 700 "$authdir"
          config="$authdir/registry-auth.json"
          trap 'rm -f "$config"; unset FORGEJO_REGISTRY_TOKEN' EXIT
          [[ -n "$FORGEJO_REGISTRY_TOKEN" ]]
          umask 077
          printf '%s' "$FORGEJO_REGISTRY_TOKEN" | oras login git.cybit.top --username cybit --password-stdin --registry-config "$config"
          chmod 600 "$config"
          python3 .github/scripts/package-release.py publish --directory "$RUNNER_TEMP/build/package" --registry-config "$config" > "$RUNNER_TEMP/published.json"
          python3 - <<'PY'
          import json,os
          result=json.load(open(os.environ['RUNNER_TEMP']+'/published.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Published and verified immutable package: `'+result['reference']+'`\n')
          PY
      - if: always()
        name: Remove registry authentication
        shell: bash
        run: rm -f "$RUNNER_TEMP/forgejo-auth/registry-auth.json"
  summarize:
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - *oras
      - name: Anonymously verify both platforms and preserve user release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          tag=os.environ['RELEASE_TAG']; commit=os.environ['SOURCE_SHA']; temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          references=[]
          for platform in ('darwin','linux'):
              output=subprocess.check_output(['python3','.github/scripts/package-release.py','check','--tag',tag,'--commit',commit,'--platform',platform,'--output-dir',str(temp/platform)],text=True)
              result=json.loads(output)
              if not result['exists']: raise SystemExit('missing platform release')
              references.append((platform,result['reference']))
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/cybito/manygit/'+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response: return json.load(response)
          release=api('GET','releases/tags/'+tag)
          if release['assets']: raise SystemExit('GitHub Release assets must remain empty')
          lines=['<!-- custom-builds:start -->','## Custom ARM64 installation packages','Source: `'+commit+'` · Release: `'+tag+'`','Package: https://git.cybit.top/cybit/-/packages/container/ias-manygit','']
          for platform,reference in references:
              lines += ['### '+platform,'Immutable reference: `'+reference+'`','```sh','oras pull '+reference,'```','']
          lines += ['<!-- custom-builds:end -->']
          block='\n'.join(lines); body=release.get('body') or ''
          start='<!-- custom-builds:start -->'; end='<!-- custom-builds:end -->'
          if (start in body)!=(end in body) or body.count(start)>1 or body.count(end)>1: raise SystemExit('malformed custom-build notes block')
          if start in body:
              first=body.index(start); last=body.index(end)
              if last<first: raise SystemExit('malformed custom-build notes order')
              body=body[:first]+block+body[last+len(end):]
          else: body=body.rstrip()+'\n\n'+block
          api('PATCH','releases/'+str(release['id']),{'body':body})
          PY

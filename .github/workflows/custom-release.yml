name: Custom release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: custom-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'cybito/manygit' && !github.event.release.draft
    runs-on: ubuntu-24.04-arm
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch custom ancestry without persisted credentials
        shell: bash
        run: git fetch --no-tags origin +refs/heads/custom:refs/remotes/origin/custom
      - id: validate
        name: Validate exact custom release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess,tempfile
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if event['action']!='published' or event['release']['draft']: raise ValueError('release must be published')
          paths=('.github/workflows/custom-release.yml','.github/scripts/custom-release.sh','.github/scripts/package-release.py')
          def validate(tag,cwd=None):
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-custom\.[1-9][0-9]*',tag): raise ValueError('invalid release tag')
              def git(*args): return subprocess.check_output(['git',*args],cwd=cwd,text=True,stderr=subprocess.DEVNULL).strip()
              commit=git('rev-parse','--verify','refs/tags/'+tag+'^{commit}')
              if not re.fullmatch(r'[0-9a-f]{40}',commit): raise ValueError('invalid source SHA')
              git('merge-base','--is-ancestor',commit,'refs/remotes/origin/custom')
              for path in paths: git('cat-file','-e',commit+':'+path)
              if git('rev-parse','HEAD')!=commit: raise ValueError('release checkout differs from tag')
              return commit
          with tempfile.TemporaryDirectory() as tmp:
              def fixture(*args): return subprocess.check_output(['git',*args],cwd=tmp,text=True,stderr=subprocess.DEVNULL).strip()
              fixture('init'); fixture('config','user.name','CI'); fixture('config','user.email','ci@example.invalid')
              for path in paths:
                  file=pathlib.Path(tmp)/path; file.parent.mkdir(parents=True,exist_ok=True); file.write_text('fixture')
              fixture('add','.'); fixture('commit','-m','custom fixture')
              root=fixture('rev-parse','HEAD'); fixture('update-ref','refs/remotes/origin/custom',root); fixture('tag','v1.1.7-custom.1')
              assert validate('v1.1.7-custom.1',tmp)==root
              fixture('commit','--allow-empty','-m','upstream only'); fixture('tag','v1.1.7-custom.2')
              for invalid in ('v1.1.7-custom.2','v1.1.7','v1.1.7-custom.0','v1.1.7-custom.1;touch '+tmp+'/injected'):
                  try: validate(invalid,tmp)
                  except (ValueError,subprocess.CalledProcessError): pass
                  else: raise AssertionError('invalid release accepted: '+invalid)
              assert not (pathlib.Path(tmp)/'injected').exists()
          commit=validate(os.environ['RELEASE_TAG'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('commit='+commit+'\ntag='+os.environ['RELEASE_TAG']+'\n')
          PY
      - name: Test GitHub Release asset reconciliation
        run: python3 .github/scripts/test-package-release.py
  build:
    needs: validate
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: custom-release-${{ github.repository }}-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      MANYGIT_NO_UPDATE_CHECK: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise asset identity, checksum, and no-clobber boundaries
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib,tempfile
          spec=importlib.util.spec_from_file_location('package_release','.github/scripts/package-release.py')
          helper=importlib.util.module_from_spec(spec); spec.loader.exec_module(helper)
          assert helper.asset_name('v1.1.7-custom.1','linux','release.json')=='v1.1.7-custom.1-linux-release.json'
          try: helper.identity('v1.1.7-custom.0','a'*40,'linux')
          except ValueError: pass
          else: raise AssertionError('invalid release identity accepted')
          assert helper.MAX_ASSET_SIZE==2*1024*1024*1024 and helper.MAX_ASSETS==1000
          PY
      - name: Check existing GitHub Release assets
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/existing" > "$RUNNER_TEMP/check.json"
          python3 - <<'PY'
          import json,os
          result=json.load(open(os.environ['RUNNER_TEMP']+'/check.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('exists='+str(result['exists']).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              if result['exists']: f.write('Verified immutable GitHub Release assets: '+', '.join('`'+n+'`' for n in result['assets'])+'\n')
          PY
      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - if: steps.check.outputs.exists == 'false'
        name: Build native ARM64 package and smoke fixture install
        shell: bash
        run: bash .github/scripts/custom-release.sh build "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/build"
      - if: steps.check.outputs.exists == 'false'
        name: Upload missing GitHub Release assets without overwrite
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py publish --directory "$RUNNER_TEMP/build/package" > "$RUNNER_TEMP/published.json"
          cat "$RUNNER_TEMP/published.json" >> "$GITHUB_STEP_SUMMARY"
  summarize:
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Independently verify both platforms and preserve user release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          tag=os.environ['RELEASE_TAG']; commit=os.environ['SOURCE_SHA']; temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          assets=[]
          for platform in ('darwin','linux'):
              output=temp/platform
              result=json.loads(subprocess.check_output(['python3','.github/scripts/package-release.py','check','--tag',tag,'--commit',commit,'--platform',platform,'--output-dir',str(output)],text=True))
              if not result['exists']: raise SystemExit('missing platform release assets')
              assets.extend((platform,name) for name in result['assets'])
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/cybito/manygit/'+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response: return json.load(response)
          release=api('GET','releases/tags/'+tag)
          lines=['<!-- custom-builds:start -->','## Custom ARM64 installation packages','Source: `'+commit+'` · Release: `'+tag+'`','']
          for platform in ('darwin','linux'):
              lines += ['### '+platform]
              for _,name in (item for item in assets if item[0]==platform): lines += ['- [Download '+name+'](https://github.com/cybito/manygit/releases/download/'+tag+'/'+name+')']
              lines += ['']
          lines += ['<!-- custom-builds:end -->']
          block='\n'.join(lines); body=release.get('body') or ''; start='<!-- custom-builds:start -->'; end='<!-- custom-builds:end -->'
          if (start in body)!=(end in body) or body.count(start)>1 or body.count(end)>1: raise SystemExit('malformed custom-build notes block')
          if start in body:
              first=body.index(start); last=body.index(end)
              if last<first: raise SystemExit('malformed custom-build notes order')
              body=body[:first]+block+body[last+len(end):]
          else: body=body.rstrip()+'\n\n'+block
          api('PATCH','releases/'+str(release['id']),{'body':body})
          PY
